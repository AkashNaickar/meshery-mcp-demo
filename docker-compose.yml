services:
  meshery-mcp-demo:
    build: .
    image: meshery-mcp-demo:latest
    environment:
      MESHERY_SERVER_URL: http://meshery:9081
      MESHERY_MCP_TRANSPORT: http
      MESHERY_MCP_HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - meshery-auth:/root/.meshery:ro
    restart: unless-stopped

volumes:
  meshery-auth:
    name: meshery-auth